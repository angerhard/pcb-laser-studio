# PCB Laser Studio - "Graphite & Cyan" theme
# Keep these base values in sync with view/theme/DarkTheme.java Java constants.

@background = #1e1e1e
@foreground = #f2f2f2
@disabledForeground = #5c5c5c
@accentColor = #2dd4bf

@componentBackground = #242424
@buttonBackground = #262626
@borderColor = #3a3a3a

# ── Shape: small, subtle rounding everywhere ────────────────────────────
Component.arc = 6
Button.arc = 6
CheckBox.icon.arc = 4
ProgressBar.arc = 4
TextComponent.arc = 6
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderWidth = 1

# ── Slider: thin Lightroom-style track + small thumb + filled value ────
Slider.trackWidth = 3
Slider.thumbSize = 11,11
Slider.trackColor = #333333
Slider.trackValueColor = @accentColor
Slider.thumbColor = @accentColor
Slider.hoverThumbColor = lighten(@accentColor,8%)
Slider.pressedThumbColor = darken(@accentColor,8%)
Slider.thumbBorderColor = null
Slider.focusWidth = 2
Slider.disabledTrackColor = #2a2a2a
Slider.disabledThumbColor = #555555

# ── Scrollbars: thin, pill-shaped, no arrow buttons ─────────────────────
ScrollBar.width = 10
ScrollBar.thumbArc = 999
ScrollBar.trackArc = 999
ScrollBar.thumb = #3a3a3a
ScrollBar.hoverThumbColor = #4a4a4a
ScrollBar.track = #1a1a1a
ScrollBar.showButtons = false

# ── TabbedPane: slim, flat, underline-selected ──────────────────────────
TabbedPane.tabHeight = 26
TabbedPane.selectedBackground = #262626
TabbedPane.hoverColor = #262626
TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = #555555
TabbedPane.showTabSeparators = false
TabbedPane.tabSeparatorsFullHeight = false
TabbedPane.tabWidthMode = compact

# ── Buttons: compact padding ─────────────────────────────────────────────
Button.margin = 3,10,3,10
ToggleButton.margin = 3,10,3,10

# ── ProgressBar ──────────────────────────────────────────────────────────
ProgressBar.foreground = @accentColor
